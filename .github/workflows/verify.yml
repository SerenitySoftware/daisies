name: Verify

on:
  pull_request:
  push:
    branches: [master]

# A new push supersedes the run already in flight for the same branch.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verification:
    name: Code Analysis and Testing
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11", "3.12", "3.13" ]
        poetry-version: [ "2.4.3" ]
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    outputs:
      coverage: ${{ steps.generate-coverage.outputs.coverage }}
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Install Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Poetry
      uses: abatilo/actions-poetry@v4
      with:
        poetry-version: ${{ matrix.poetry-version }}
    - name: Configure Poetry
      run: |
        poetry config virtualenvs.create true --local
        poetry config virtualenvs.in-project true --local
    - name: Cache virtualenv
      uses: actions/cache@v5
      with:
        path: ./.venv
        # The venv is platform- and interpreter-specific, so the key must be
        # too — a bare lockfile hash lets a macOS venv restore into a Windows
        # job and vice versa.
        key: venv-${{ matrix.os }}-py${{ matrix.python-version }}-${{ hashFiles('poetry.lock') }}
    - name: Install Dependencies
      run: poetry install
    - name: Run Black
      run: poetry run black --check .
    - name: Run Flake8
      run: poetry run flake8 .
    - name: Run Automated Tests
      run: poetry run coverage run -m pytest
    - name: Generate Coverage Report
      id: generate-coverage
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
      run: |
        poetry run coverage xml
        {
          echo 'coverage<<EOF'
          cat coverage.xml
          echo 'EOF'
        } >> "$GITHUB_OUTPUT"
  coverage:
    name: Publish Quality Metrics
    runs-on: ubuntu-latest
    needs: verification
    timeout-minutes: 10
    steps:
      - name: Dump Coverage Report
        run: echo "$COVERAGE" > coverage.xml
        env:
          COVERAGE: ${{needs.verification.outputs.coverage}}
      - name: Publish Coverage Report
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage.xml
          badge: true
          fail_below_min: true
          format: markdown
          hide_branch_rate: false
          hide_complexity: false
          indicators: true
          output: both
          thresholds: '100 100'
      - name: Publish Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: github.event_name == 'pull_request'
        with:
          recreate: true
          path: code-coverage-results.md
